name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medvisit
          POSTGRES_PASSWORD: medvisit
          POSTGRES_DB: medvisit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medvisit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medvisit:medvisit@localhost:5432/medvisit_test
      TEST_DATABASE_URL: postgresql://medvisit:medvisit@localhost:5432/medvisit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run test:integration

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medvisit
          POSTGRES_PASSWORD: medvisit
          POSTGRES_DB: medvisit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medvisit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medvisit:medvisit@localhost:5432/medvisit
      NEXTAUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: medvisit-app:ci
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
          tags: medvisit-migrate:ci
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
